; ============================================================================
; Módulo A — aquisição OBD2
; ESP32-C3 SuperMini + transceptor CAN SN65HVD230 (terminação de 120R removida)
; Framework: ESP-IDF v5.x puro via fork pioarduino do platform-espressif32
;
; Dois ambientes, MESMO código:
;   modulo_a_bancada — bancada com o simulador Arduino+MCP2515 (2 nós só).
;                      Aceita erro elétrico como prova de tráfego na escuta
;                      inicial, porque sem um 3º nó ninguém dá ACK e nenhum
;                      quadro chega válido em listen-only. Ver can_obd2.c.
;   modulo_a_carro   — firmware do Fiesta. Escuta estrita: só quadro válido
;                      libera a transmissão. Nunca grave o de bancada no carro.
;
; A taxa do CAN (250k/500k) NÃO é escolhida aqui: fica na NVS e é trocada
; pela tela de configuração do Módulo B.
; ============================================================================

[platformio]
default_envs = modulo_a_bancada

[env]
; pioarduino 55.03.312-1 (22/09/2026) — ESP-IDF 5.5.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = esp32-c3-devkitm-1

board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp_idf_exception_decoder

; Header comum (contrato telem_pacote_t) fica um nível acima do módulo
; Medições do artigo (desligadas no uso normal): troque 0 por 1 e dê Clean.
;   MEDICAO_RESPOSTA_ECM — linha "MEDICAO ECM ..." no serial a cada 10 s
;   MEDICAO_LATENCIA     — GPIO 10 inverte a cada resposta de RPM (osciloscópio)
build_flags =
    -I$PROJECT_DIR/../comum
    -DMEDICAO_RESPOSTA_ECM=0
    -DMEDICAO_LATENCIA=0

[env:modulo_a_bancada]
build_flags =
    ${env.build_flags}
    -DCAN_BANCADA_ACEITA_SEM_ACK=1

[env:modulo_a_carro]
build_flags =
    ${env.build_flags}
    -DCAN_BANCADA_ACEITA_SEM_ACK=0

; modulo_a_demo — SEM CAN: o driver TWAI nem é instalado. Gera dados
;                 simulados (ciclo de condução, aquecimento, superaquecimento)
;                 e manda pelo ESP-NOW. Para testar o Módulo B sem carro e sem
;                 o simulador Arduino. No carro não serve: não lê nada.
[env:modulo_a_demo]
build_flags =
    ${env.build_flags}
    -DCAN_BANCADA_ACEITA_SEM_ACK=1
    -DMODO_DEMO=1
