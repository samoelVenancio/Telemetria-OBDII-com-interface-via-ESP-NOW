; ============================================================================
; Módulo B — exibição
; Placa Sunton com ESP32-S3-WROOM-1-N16R8 (16 MB flash QIO, 8 MB PSRAM octal),
; painel RGB IPS 800x480, touch capacitivo GT911 no I2C.
; Framework: ESP-IDF v5.x puro via fork pioarduino do platform-espressif32.
;
; Flash/PSRAM/modo ficam declarados na board customizada
; boards/sunton_8048s043.json — não em flags soltas aqui.
; ============================================================================

[env:modulo_b]
; pioarduino 55.03.312-1 (22/09/2026) — ESP-IDF 5.5.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = sunton_8048s043

board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp_idf_exception_decoder

; Header comum (contrato telem_pacote_t) fica um nível acima do módulo
build_flags =
    -I$PROJECT_DIR/../comum
