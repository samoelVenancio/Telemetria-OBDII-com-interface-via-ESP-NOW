; ============================================================================
; Simulador de ECM para BANCADA — Arduino Uno/Nano + módulo MCP2515 (8 MHz)
;
; Ferramenta de teste, NÃO faz parte do sistema embarcado. Por isso aqui é
; Arduino mesmo: a regra "ESP-IDF puro" vale para os Módulos A e B.
;
; Responde como o ECM do New Fiesta (0x7E0 -> 0x7E8) aos 8 PIDs do projeto,
; com um ciclo de condução sintético. Taxa padrão 250 kbit/s, trocável pelo
; monitor serial (ver src/main.cpp).
; ============================================================================

[platformio]
default_envs = uno

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps =
    autowp/autowp-mcp2515@^1.3.1

[env:uno]
board = uno

; Nano com bootloader novo. Se o upload falhar com "not in sync", use o
; board = nanoatmega328 (bootloader antigo).
[env:nano]
board = nanoatmega328new
